    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        let familyCount = 2; // Dimulai dari 2 karena sudah ada Ibu dan Ayah
        const accordionKeluarga = document.getElementById("accordionKeluarga");
        const btnTambahKeluarga = document.getElementById("btnTambahKeluarga");

        // Fungsi Tambah Anggota Keluarga
        btnTambahKeluarga.addEventListener("click", function () {
          familyCount++;
          const newId = `keluarga-${familyCount}`;

          const newItem = `
            <div class="accordion-item mb-3 border rounded-3 overflow-hidden">
              <h2 class="accordion-header">
                <button class="accordion-button bg-light fw-bold collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${newId}">
                  Anggota Keluarga Baru
                </button>
              </h2>
              <div id="collapse${newId}" class="accordion-collapse collapse">
                <div class="accordion-body">
                  <div class="row g-3">
                    <div class="col-md-4">
                      <label class="form-label">Hubungan</label>
                      <select class="form-select">
                        <option value="" selected disabled>Pilih Hubungan...</option>
                        <option value="1">Suami</option>
                        <option value="2">Istri</option>
                        <option value="3">Anak</option>
                        <option value="4">Ayah</option>
                        <option value="5">Ibu</option>
                      </select>
                    </div>
                    <div class="col-md-8">
                      <label class="form-label">Nama Lengkap</label>
                      <input type="text" class="form-control" placeholder="Masukkan nama" />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Status</label>
                      <select class="form-select">
                        <option value="Hidup" selected>Hidup</option>
                        <option value="Meninggal">Meninggal</option>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Tanggal Lahir</label>
                      <input type="date" class="form-control" />
                    </div>
                    <div class="col-12 d-flex justify-content-end mt-2">
                      <button type="button" class="btn btn-sm btn-danger btn-hapus-keluarga"><i class="bi bi-trash"></i> Hapus</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;

          // Tambahkan item baru ke dalam akordeon
          accordionKeluarga.insertAdjacentHTML("beforeend", newItem);

          // Opsional: Buka otomatis akordeon yang baru ditambahkan
          const newCollapse = new bootstrap.Collapse(document.getElementById(`collapse${newId}`));
          newCollapse.show();
        });

        // Fungsi Hapus Anggota Keluarga (Event Delegation)
        accordionKeluarga.addEventListener("click", function (e) {
          // Cari elemen terdekat yang memiliki class 'btn-hapus-keluarga'
          const btnHapus = e.target.closest(".btn-hapus-keluarga");

          if (btnHapus) {
            // Konfirmasi sebelum menghapus
            if (confirm("Apakah Anda yakin ingin menghapus data keluarga ini?")) {
              const item = btnHapus.closest(".accordion-item");
              item.remove();
            }
          }
        });

        // === KODE BARU UNTUK TOGGLE ALAMAT DOMISILI ===
        const checkboxSamaKtp = document.getElementById("samaKtp");
        const formDomisili = document.getElementById("formDomisili");

        // Fungsi untuk mengecek status saat pertama kali halaman dimuat
        function toggleDomisili() {
          if (checkboxSamaKtp.checked) {
            formDomisili.style.display = "none"; // Sembunyikan form jika sama dengan KTP
          } else {
            formDomisili.style.display = "flex"; // Tampilkan form jika berbeda
          }
        }

        // Panggil fungsi saat halaman pertama dimuat
        toggleDomisili();

        // Jalankan fungsi setiap kali checkbox diklik
        checkboxSamaKtp.addEventListener("change", toggleDomisili);
      });
    </script>
